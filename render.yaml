services:
  # -------------------------------------------------------------
  # 1. SkillBridge Backend Web Service (Spring Boot 3 REST API)
  # -------------------------------------------------------------
  - type: web
    name: skillbridge-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: dev

  # -------------------------------------------------------------
  # 2. SkillBridge Frontend Static Site (React 18 + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: skillbridge-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: skillbridge-backend
          property: host
