services:
  # -------------------------------------------------------------
  # 1. SkillBridge Backend Web Service (Spring Boot 3 REST API)
  # -------------------------------------------------------------
  - type: web
    name: skillbridge-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://skillbridg15-anurag-1108.c.aivencloud.com:26802/defaultdb?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
